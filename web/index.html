<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <title>gitmirror 管理页</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <header>
    <h1>gitmirror</h1>
    <p>Git 裸仓镜像 · refs / Sync</p>
  </header>
  <section>
    <h2>远端</h2>
    <input id="remoteUrl" placeholder="remote url" size="48"/>
    <button id="btnSaveRemote">保存 Remote</button>
  </section>
  <section>
    <h2>同步</h2>
    <button id="btnSync">Sync</button>
    <button id="btnRefresh">刷新 Refs</button>
    <pre id="out"></pre>
  </section>
  <script src="app.js"></script>
</body>
</html>
